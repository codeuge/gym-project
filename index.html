<!doctype html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Ripresa</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%8B%EF%B8%8F%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --bg:#F4F5F7;
    --surface:#FFFFFF;
    --surface-2:#EEF0F3;
    --border:#E1E4E9;
    --ink:#14161B;
    --ink-2:#565B66;
    --ink-3:#8A8F99;
    --accent:#2A4CDB;
    --accent-ink:#FFFFFF;
    --accent-soft:#E8ECFC;
    --ember:#E8622C;
    --ember-soft:#FCE7DD;
    --success:#1F9D55;
    --success-soft:#E4F6EB;
    --warning:#B8790A;
    --warning-soft:#FBF0DA;
    --danger:#D64545;
    --danger-soft:#FBE6E6;
    --shadow-sm:0 1px 2px rgba(20,22,27,.05);
    --shadow-md:0 10px 30px rgba(20,22,27,.10);
    --radius-lg:18px;
    --radius-md:12px;
    --radius-sm:9px;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#131419;
      --surface:#1C1E25;
      --surface-2:#22252D;
      --border:#2B2E38;
      --ink:#F2F3F5;
      --ink-2:#B7BBC4;
      --ink-3:#797E89;
      --accent:#6E8BFF;
      --accent-ink:#0D1020;
      --accent-soft:#232A47;
      --ember:#FF8A5B;
      --ember-soft:#3A281E;
      --success:#38C77E;
      --success-soft:#1B3226;
      --warning:#E8B93B;
      --warning-soft:#392E14;
      --danger:#EB6C6C;
      --danger-soft:#3A2020;
      --shadow-sm:0 1px 2px rgba(0,0,0,.3);
      --shadow-md:0 10px 30px rgba(0,0,0,.45);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#131419;
    --surface:#1C1E25;
    --surface-2:#22252D;
    --border:#2B2E38;
    --ink:#F2F3F5;
    --ink-2:#B7BBC4;
    --ink-3:#797E89;
    --accent:#6E8BFF;
    --accent-ink:#0D1020;
    --accent-soft:#232A47;
    --ember:#FF8A5B;
    --ember-soft:#3A281E;
    --success:#38C77E;
    --success-soft:#1B3226;
    --warning:#E8B93B;
    --warning-soft:#392E14;
    --danger:#EB6C6C;
    --danger-soft:#3A2020;
    --shadow-sm:0 1px 2px rgba(0,0,0,.3);
    --shadow-md:0 10px 30px rgba(0,0,0,.45);
    color-scheme:dark;
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,p{margin:0;}
  button{font-family:inherit;}
  input,select,textarea{font-family:inherit;}
  ::selection{background:var(--accent-soft);}
  .num{font-variant-numeric:tabular-nums;}
  svg{display:block;width:18px;height:18px;flex:none;}

  #shell{
    max-width:560px;
    margin:0 auto;
    height:100dvh;
    display:flex;
    flex-direction:column;
    position:relative;
    overflow-y:auto;
    overflow-x:hidden;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior-y:contain;
    padding-top:calc(80px + env(safe-area-inset-top));
    padding-bottom:calc(90px + env(safe-area-inset-bottom));
  }

  /* Topbar */
  .topbar{
    position:fixed;top:0;left:0;right:0;z-index:20;
    background:color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);
    display:flex;justify-content:center;
  }
  .topbar-inner{
    max-width:560px;width:100%;
    padding:calc(14px + env(safe-area-inset-top)) 10% 14px;
  }
  .topbar .eyebrow{
    font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);
  }
  .topbar h1{
    font-size:24px;font-weight:800;letter-spacing:-.01em;margin-top:2px;text-wrap:balance;
  }
  .topbar-row{display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .topbar-title{min-width:0;flex:1;}
  .topbar-action{
    position:relative;overflow:hidden;border-radius:8px;flex:none;
    display:inline-flex;align-items:center;gap:6px;
    background:none;border:none;color:var(--accent);font-weight:800;font-size:14px;padding:6px 4px;cursor:pointer;
    transition:transform .08s ease;
  }
  .topbar-action svg{width:16px;height:16px;}
  .topbar-action:active{transform:scale(.94);}

  main{flex:1;padding:18px 10% 28px;}
  .view{display:none;animation:fadein .18s ease;}
  .view.active{display:block;}
  @keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

  /* Cards */
  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    padding:18px;
    box-shadow:var(--shadow-sm);
  }
  .card + .card{margin-top:14px;}
  .section-title{
    font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);
    margin:24px 2px 10px;
  }
  .section-title:first-child{margin-top:0;}
  .section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:24px 2px 10px;}
  .section-head:first-child{margin-top:0;}
  .section-head-label{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);}

  /* Buttons — same language everywhere: bold weight, soft 14px radius, gentle press, subtle lift on filled actions */
  .btn{
    position:relative;overflow:hidden;
    appearance:none;border:none;cursor:pointer;border-radius:14px;
    font-weight:800;font-size:15px;padding:13px 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px;
    transition:transform .08s ease, opacity .12s ease, box-shadow .12s ease;
  }
  .btn svg{width:17px;height:17px;flex:none;}
  .btn:active{transform:scale(.97);}
  .btn-block{width:100%;}
  .btn-primary{
    background:linear-gradient(135deg, var(--accent) 0%, color-mix(in srgb, var(--accent) 80%, black 20%) 100%);
    color:var(--accent-ink);box-shadow:var(--shadow-sm);
  }
  .btn-secondary{background:var(--surface-2);color:var(--ink);}
  .btn-ghost{background:transparent;color:var(--accent);padding:10px 12px;}
  .btn-danger{background:var(--danger-soft);color:var(--danger);}
  .btn-lg{padding:17px 22px;font-size:16.5px;border-radius:16px;}
  .btn-sm{padding:9px 14px;font-size:13px;border-radius:11px;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .icon-btn{
    position:relative;overflow:hidden;
    width:36px;height:36px;border-radius:12px;border:1px solid var(--border);background:var(--surface);
    display:inline-flex;align-items:center;justify-content:center;color:var(--ink-2);cursor:pointer;flex:none;
    transition:transform .08s ease;
  }
  .icon-btn svg{width:17px;height:17px;}
  .icon-btn:active{transform:scale(.94);}

  /* Forms */
  label.field{display:block;margin-bottom:14px;}
  label.field:last-child{margin-bottom:0;}
  .field-label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-2);margin-bottom:6px;letter-spacing:.01em;}
  .input, select.input, textarea.input{
    width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);
    padding:12px 13px;font-size:15.5px;color:var(--ink);outline:none;
  }
  .input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  textarea.input{resize:vertical;min-height:70px;}
  .row-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
  .checkbox-row{display:flex;align-items:center;gap:9px;font-size:14.5px;color:var(--ink-2);font-weight:600;}
  .checkbox-row input{width:18px;height:18px;accent-color:var(--accent);}

  /* Chips */
  .chip-group{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;-ms-overflow-style:none;scrollbar-width:none;}
  .chip-group::-webkit-scrollbar{display:none;}
  .chip{
    position:relative;overflow:hidden;
    flex:none;border:1px solid var(--border);background:var(--surface);color:var(--ink-2);
    font-size:13.5px;font-weight:800;padding:8px 14px;border-radius:999px;cursor:pointer;white-space:nowrap;
    transition:transform .08s ease, background .12s ease, color .12s ease, border-color .12s ease;
  }
  .chip:active{transform:scale(.96);}
  .chip.active{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow-sm);}

  /* Stat tiles */
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .stat-tile{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
    padding:16px;box-shadow:var(--shadow-sm);
  }
  .stat-tile .stat-label{font-size:12px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;}
  .stat-tile .stat-value{
    font-size:26px;font-weight:800;margin-top:6px;letter-spacing:-.01em;
    display:flex;align-items:baseline;flex-wrap:wrap;gap:6px 10px;
  }
  .stat-tile .stat-value small{font-size:14px;font-weight:700;color:var(--ink-3);}
  .stat-tile .stat-delta{font-size:12.5px;font-weight:700;margin-top:5px;display:inline-flex;align-items:center;gap:3px;}
  .delta-up{color:var(--danger);}
  .delta-down{color:var(--success);}
  .delta-flat{color:var(--ink-3);}
  .pct-badge{
    display:inline-flex;align-items:center;font-size:12px;font-weight:800;
    padding:2px 7px;border-radius:999px;vertical-align:middle;
  }
  .pct-badge.pct-up{background:var(--danger-soft);color:var(--danger);}
  .pct-badge.pct-down{background:var(--success-soft);color:var(--success);}
  .pct-badge.pct-flat{background:var(--surface-2);color:var(--ink-3);}

  /* Start-workout hero card */
  .start-card{
    background:linear-gradient(135deg, var(--accent) 0%, var(--ember) 130%);
    border:none;box-shadow:var(--shadow-md);
  }
  .start-card-top{display:flex;align-items:center;gap:12px;margin-bottom:16px;}
  .start-icon{
    width:44px;height:44px;border-radius:13px;background:rgba(255,255,255,.2);
    display:flex;align-items:center;justify-content:center;flex:none;color:var(--accent-ink);
  }
  .start-icon svg{width:22px;height:22px;}
  .start-card h3{font-size:16.5px;font-weight:800;color:var(--accent-ink);}
  .start-sub{font-size:12.5px;font-weight:600;color:var(--accent-ink);opacity:.82;margin-top:2px;}
  .start-btn{
    width:100%;background:var(--accent-ink);color:var(--accent);border:none;border-radius:14px;
    padding:15px 18px;font-weight:800;font-size:15.5px;display:flex;align-items:center;justify-content:center;gap:8px;
    cursor:pointer;transition:transform .08s ease;
  }
  .start-btn svg{width:17px;height:17px;}
  .start-btn:active{transform:scale(.97);}

  /* Empty state */
  .empty{
    text-align:center;padding:34px 20px;border:1.5px dashed var(--border);border-radius:var(--radius-lg);color:var(--ink-2);
  }
  .empty .icon-wrap{
    width:52px;height:52px;border-radius:14px;background:var(--accent-soft);color:var(--accent);
    display:flex;align-items:center;justify-content:center;margin:0 auto 14px;
  }
  .empty .icon-wrap svg{width:24px;height:24px;}
  .empty h3{font-size:16px;font-weight:800;color:var(--ink);margin-bottom:6px;}
  .empty p{font-size:13.5px;line-height:1.5;margin-bottom:16px;}

  /* Bottom nav */
  nav.navbar{
    position:fixed;left:0;right:0;bottom:0;z-index:30;
    background:color-mix(in srgb, var(--surface) 92%, transparent);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-top:1px solid var(--border);
    display:flex;justify-content:center;
    padding-bottom:calc(14px + env(safe-area-inset-bottom));
  }
  .navbar-inner{max-width:560px;width:100%;display:flex;padding:0 10%;}
  .navbtn{
    position:relative;overflow:hidden;border-radius:14px;
    flex:1;background:none;border:none;cursor:pointer;padding:10px 4px 8px;
    display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink-3);
  }
  .navbtn svg{width:22px;height:22px;}
  .navbtn span{font-size:10.5px;font-weight:700;}
  .navbtn.active{color:var(--accent);}

  /* Mini timer chip */
  .mini-timer{
    position:fixed;left:0;right:0;bottom:calc(78px + env(safe-area-inset-bottom));
    display:flex;justify-content:center;z-index:29;pointer-events:none;
  }
  .mini-timer.hidden{display:none;}
  .mini-timer-inner{
    pointer-events:all;
    background:var(--ink);color:var(--bg);
    border-radius:999px;padding:9px 16px 9px 10px;
    display:flex;align-items:center;gap:10px;box-shadow:var(--shadow-md);cursor:pointer;
    max-width:calc(100% - 40px);
  }
  .mini-timer-dot{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none;}
  .mini-timer-dot.paused{background:var(--ink-3);}
  .mini-timer-time{font-weight:800;font-size:14.5px;}
  .mini-timer-label{font-size:12px;opacity:.7;font-weight:600;}

  /* Sheet / modal */
  .sheet-backdrop{
    position:fixed;inset:0;background:rgba(10,11,15,.5);z-index:50;
    display:flex;align-items:flex-end;justify-content:center;
    opacity:0;pointer-events:none;transition:opacity .18s ease;
  }
  .sheet-backdrop.open{opacity:1;pointer-events:all;}
  .sheet{
    width:100%;max-width:560px;background:var(--surface);
    border-radius:22px 22px 0 0;
    max-height:88dvh;display:flex;flex-direction:column;
    transform:translateY(16px);transition:transform .2s ease;
    box-shadow:var(--shadow-md);
  }
  .sheet-backdrop.open .sheet{transform:translateY(0);}
  .sheet-handle{width:38px;height:4px;background:var(--border);border-radius:99px;margin:10px auto 2px;flex:none;}
  .sheet-header{padding:12px 10% 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--border);flex:none;}
  .sheet-header h2{font-size:17px;font-weight:800;}
  .sheet-body{padding:16px 10%;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;}
  .sheet-actions{padding:14px 10% calc(20px + env(safe-area-inset-bottom));border-top:1px solid var(--border);display:flex;gap:10px;flex:none;}

  /* Plan display */
  .day-block{border:1px solid var(--border);border-radius:var(--radius-md);padding:16px 12px;margin-bottom:12px;}
  .day-block:last-child{margin-bottom:0;}
  .day-block h4{font-size:16px;font-weight:800;margin-bottom:12px;}
  .day-focus{text-align:center;}
  .ex-table td:first-child{font-weight:600;color:var(--ink);}
  .m-table.ex-table th, .m-table.ex-table td{font-size:14.5px;padding:13px 10px;line-height:1.35;}
  .m-table.ex-table th:first-child, .m-table.ex-table td:first-child{padding-left:4px;}
  .m-table.ex-table th:last-child, .m-table.ex-table td:last-child{padding-right:4px;}
  .m-table.ex-table th{font-size:11px;}

  .plan-editor-day{border:1px solid var(--border);border-radius:var(--radius-md);padding:12px;margin-bottom:12px;}
  .plan-editor-day-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .plan-editor-day-head .input{flex:1;}
  .editor-ex-row{display:grid;grid-template-columns:1fr 46px 60px 60px 34px;gap:6px;margin-bottom:8px;align-items:center;}
  .editor-ex-row .input{padding:9px 8px;font-size:13.5px;}
  .add-row-btn{
    position:relative;overflow:hidden;
    width:100%;border:none;background:var(--surface-2);border-radius:12px;
    padding:9px 12px;color:var(--ink-2);font-weight:800;font-size:12.5px;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    transition:transform .08s ease, background .12s ease, color .12s ease;
  }
  .add-row-btn svg{width:14px;height:14px;flex:none;}
  .add-row-btn:active{transform:scale(.96);}
  .add-row-btn.inline{width:auto;padding:9px 16px;border-radius:999px;}

  /* Plan list card */
  .plan-card{position:relative;padding-left:14px;padding-right:14px;}
  .plan-card .badge-active{
    position:absolute;top:16px;right:16px;background:var(--success-soft);color:var(--success);
    font-size:11px;font-weight:800;padding:4px 9px;border-radius:999px;letter-spacing:.02em;
  }
  .plan-card h3{font-size:16.5px;font-weight:800;margin-bottom:2px;padding-right:70px;}
  .plan-card .plan-meta{font-size:12.5px;color:var(--ink-3);margin-bottom:12px;font-weight:600;}
  .plan-card .plan-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
  .list-row{
    position:relative;overflow:hidden;
    width:100%;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
    padding:14px 16px;margin-bottom:10px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;
    box-shadow:var(--shadow-sm);transition:transform .08s ease;
  }
  .list-row:last-child{margin-bottom:0;}
  .list-row:active{transform:scale(.98);}
  .list-row .list-row-title{display:block;font-weight:800;font-size:15px;color:var(--ink);}
  .list-row .list-row-sub{display:block;font-size:12.5px;color:var(--ink-3);font-weight:600;margin-top:3px;}
  .list-row .chev{color:var(--ink-3);flex:none;}
  .list-row .chev svg{width:18px;height:18px;display:block;}

  /* Session / checklist */
  .session-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;gap:10px;}
  .session-head .session-title{font-size:19px;font-weight:800;}
  .session-head .session-sub{font-size:13px;color:var(--ink-3);font-weight:600;margin-top:2px;}
  .session-elapsed{font-size:13px;font-weight:800;color:var(--accent);background:var(--accent-soft);padding:6px 11px;border-radius:999px;white-space:nowrap;}
  .progress-bar-track{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-bottom:18px;}
  .progress-bar-fill{height:100%;background:var(--accent);border-radius:99px;transition:width .25s ease;}

  /* Focused single-exercise carousel */
  .ex-focus-card{text-align:center;padding:20px 18px;}
  .ex-focus-card.done{border-color:var(--success);}
  .ex-focus-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .ex-nav-btn{
    position:relative;overflow:hidden;
    width:40px;height:40px;border-radius:12px;border:1px solid var(--border);background:var(--surface-2);
    display:flex;align-items:center;justify-content:center;color:var(--ink-2);cursor:pointer;flex:none;
    transition:transform .08s ease, opacity .12s ease;
  }
  .ex-nav-btn svg{width:20px;height:20px;}
  .ex-nav-btn:active{transform:scale(.92);}
  .ex-nav-btn:disabled{opacity:.28;cursor:default;}
  .ex-focus-index{font-size:12px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em;}
  .ex-focus-name{font-size:21px;font-weight:800;line-height:1.28;text-wrap:balance;margin-bottom:18px;min-height:56px;display:flex;align-items:center;justify-content:center;}
  .ex-focus-check{display:inline-flex;color:var(--success);vertical-align:middle;margin-left:3px;}
  .ex-focus-stats{display:flex;gap:12px;justify-content:center;margin-bottom:14px;}
  .ex-focus-stat{flex:1;max-width:150px;background:var(--surface-2);border-radius:16px;padding:16px 8px;}
  .ex-focus-stat-value{font-size:20px;line-height:1.15;font-weight:800;letter-spacing:-.02em;color:var(--accent);word-break:break-word;}
  .ex-focus-stat-label{font-size:11.5px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;margin-top:2px;}
  .ex-focus-rest{font-size:13px;font-weight:700;color:var(--ink-3);}
  .ex-dots-strip{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:14px;}
  .ex-dot{
    width:9px;height:9px;border-radius:50%;background:var(--border);border:none;cursor:pointer;padding:0;flex:none;
    transition:transform .12s ease, background .12s ease;
  }
  .ex-dot.done{background:var(--success);}
  .ex-dot.current{background:var(--accent);transform:scale(1.4);}
  .set-dots{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center;}
  .set-dot{
    position:relative;overflow:hidden;
    width:40px;height:40px;border-radius:12px;border:2px solid var(--border);background:var(--surface-2);

function fmtDateHuman(iso, opts){
  if(!iso) return '—';
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString('it-IT', opts || {day:'numeric', month:'short', year:'numeric'});
}
function fmtDateShort(iso){
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString('it-IT', {day:'numeric', month:'short'});
}
function fmtMMSS(totalSec){
  const s = Math.max(0, Math.round(totalSec));
  const m = Math.floor(s/60);
  const r = s%60;
  return String(m).padStart(2,'0') + ':' + String(r).padStart(2,'0');
}
function fmtRest(sec){
  if(sec == null) return '—';
  const m = Math.floor(sec/60);
  const s = sec%60;

}

function setDeep(obj, path, value){
  const keys = path.split('.');
  let cur = obj;
  for(let i=0;i<keys.length-1;i++) cur = cur[keys[i]];
  cur[keys[keys.length-1]] = value;
}

  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function vibrate(pattern){ try{ navigator.vibrate && navigator.vibrate(pattern); }catch(e){} }
function beep(){
  try{
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if(!Ctx) return;
    const ctx = new Ctx();
    [0,180,360].forEach((delay,i)=>{
      setTimeout(()=>{
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.type = 'sine';
        o.frequency.value = i===2 ? 990 : 740;
        g.gain.value = 0.0001;
        o.connect(g); g.connect(ctx.destination);
        const t = ctx.currentTime;
        g.gain.exponentialRampToValueAtTime(0.18, t+0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t+0.22);
        o.start(t); o.stop(t+0.24);
      }, delay);
    });
    setTimeout(()=>{ try{ctx.close();}catch(e){} }, 900);
  }catch(e){}
}

function parseRestToSeconds(text){
  const t = (text||'').toLowerCase();
  let m = t.match(/([\d.]+)\s*-\s*([\d.]+)\s*min/);
  if(m) return Math.round(((parseFloat(m[1])+parseFloat(m[2]))/2)*60);
  m = t.match(/([\d.]+)\s*min/);
  if(m) return Math.round(parseFloat(m[1])*60);
  m = t.match(/([\d.]+)\s*sec/);
  if(m) return Math.round(parseFloat(m[1]));
  m = t.match(/^(\d+)$/);
  if(m) return parseInt(m[1],10);
  return 90;
}
function parseMarkdownPlan(text){
  const lines = text.split(/\r?\n/);
  const days = [];
  let current = null;
  let name = 'Scheda importata';
  let sawH1 = false;
  for(const raw of lines){
    const line = raw.trim();
    let m = line.match(/^#\s+(.*)/);
    if(m && !sawH1){ name = m[1].replace(/\s+[—–-]\s+.*$/,'').trim() || name; sawH1 = true; continue; }
    m = line.match(/^##\s+(.*)/);
    if(m){
      let dayName = m[1].trim().replace(/\s*\(.*\)\s*$/,'').trim();
      if(!dayName) dayName = 'Giorno ' + String.fromCharCode(65 + days.length);
      current = {id: uid(), name: dayName, exercises: []};
      days.push(current);
      continue;
    }
    if(!/^\|/.test(line)) continue;
    if(!current){ current = {id: uid(), name: 'Giorno A', exercises: []}; days.push(current); }
    const cells = line.split('|').map(c=>c.trim()).filter((c,i,arr)=> !(i===0 && c==='') && !(i===arr.length-1 && c===''));
    if(cells.length < 3) continue;
    if(/^-+$/.test(cells[0].replace(/:/g,''))) continue;
    if(!/^\d+$/.test(cells[0])) continue;
    const exName = cells[1];
    const setsReps = cells[2] || '';
    const restRaw = cells[3] || '90 sec';
    const srMatch = setsReps.match(/(\d+)\s*x\s*([\d\-–]+(?:\s*sec)?)/i);
    const sets = srMatch ? parseInt(srMatch[1],10) : 3;
    const reps = srMatch ? srMatch[2].replace('–','-') : setsReps;
    current.exercises.push({id: uid(), name: exName, sets: sets||3, reps: reps||'', rest: parseRestToSeconds(restRaw)});
  }
  return {name, days: days.filter(d=>d.exercises.length)};
}

function computeBMI(weight, height){
  if(!weight || !height) return null;
  const h = height/100;
  return weight / (h*h);
}

}

function fieldHistory(field){

function latestField(field){
  const hist = fieldHistory(field);
  if(!hist.length) return null;
  const last = hist[hist.length-1];
  return {value: last[field], date: last.date};
}
function prevFieldValue(field){
  const hist = fieldHistory(field);
  return hist.length >= 2 ? hist[hist.length-2][field] : null;
}

  if(curValue == null) return '';
  if(prevValue == null || prevValue === 0) return `<span class="pct-badge pct-flat" title="Serve una seconda rilevazione per calcolare la variazione">—</span>`;
  const pct = ((curValue - prevValue) / prevValue) * 100;
  const cls = Math.abs(pct) < 0.05 ? 'pct-flat' : (pct > 0 ? 'pct-up' : 'pct-down');
  const sign = pct > 0 ? '+' : '';
  return `<span class="pct-badge ${cls}">${sign}${pct.toFixed(1)}%</span>`;
}

function openTimerPopup(){
  const backdrop = document.getElementById('timerBackdrop');
  const panel = document.getElementById('timerSheetPanel');
  panel.innerHTML = timerPopupHtml();
  backdrop.classList.add('open');
  backdrop.onclick = (e) => { if(e.target === backdrop) closeTimerPopup(); };
  ensureTimerLoop();
  renderMiniTimer();
}
function closeTimerPopup(){
  document.getElementById('timerBackdrop').classList.remove('open');
  renderMiniTimer();
}
function renderTimerPopupIfOpen(){
  if(!isTimerPopupOpen()) return;
  document.getElementById('timerSheetPanel').innerHTML = timerPopupHtml();
}

let timerLoopHandle = null;
function ensureTimerLoop(){
  if(timerLoopHandle) return;
  timerLoopHandle = setInterval(()=>{
    const s = state.activeSession;
    if(!s || !s.restRunning){ return; }
    const remaining = Math.max(0, Math.round((s.restEndsAt - Date.now())/1000));
    const timerText = document.getElementById('timerText');
    const ring = document.getElementById('timerRingFg');
    if(timerText) timerText.textContent = fmtMMSS(remaining);
    if(ring){
      const r = 74, C = 2*Math.PI*r;
      const frac = clamp(remaining/(s.restDuration||1),0,1);
      ring.setAttribute('stroke-dashoffset', C*(1-frac));
    }
    if(remaining <= 0){
      s.restRunning = false;
      s.restRemaining = 0;
      vibrate([160,80,160]);
      beep();
      renderTimerPopupIfOpen();
      renderMiniTimer();
      scheduleSave();
    } else {
      renderMiniTimer(true);
    }
  }, 1000);
}

function renderMiniTimer(lightweight){
  const wrap = document.getElementById('miniTimer');
  const s = state.activeSession;
  if(!s || !s.restVisible || isTimerPopupOpen()){
    wrap.classList.add('hidden');
    wrap.dataset.built = '';
    return;
  }
  const remaining = s.restRunning ? Math.max(0, Math.round((s.restEndsAt - Date.now())/1000)) : s.restRemaining;
  wrap.classList.remove('hidden');
  if(lightweight && wrap.dataset.built === '1'){
    const t = wrap.querySelector('.mini-timer-time');
    if(t) t.textContent = fmtMMSS(remaining);
    const dot = wrap.querySelector('.mini-timer-dot');
    if(dot) dot.classList.toggle('paused', !s.restRunning);
    return;
  }
  wrap.dataset.built = '1';
  wrap.innerHTML = `
    <div class="mini-timer-inner" data-action="open-timer-popup">
      <div class="mini-timer-dot ${s.restRunning?'':'paused'}"></div>
      <div class="mini-timer-time num">${fmtMMSS(remaining)}</div>
      <div class="mini-timer-label">recupero</div>
    </div>
  `;
}

function startRestTimer(seconds, exIdx){
  const s = state.activeSession;
  if(!s) return;
  s.restDuration = seconds;
  s.restRemaining = seconds;
  s.restEndsAt = Date.now() + seconds*1000;
  s.restRunning = true;
  s.restVisible = true;
  s.restExerciseIndex = exIdx;
  openTimerPopup();
  scheduleSave();
}

function savePlanDraft(mode){
  const d = ui.planDraft;
  d.days.forEach(day=>{ day.exercises = day.exercises.filter(ex=> (ex.name||'').trim() !== ''); });
  d.days = d.days.filter(day=> day.exercises.length > 0);
  if(!d.days.length){ toast('Aggiungi almeno un esercizio'); return; }
  d.name = (d.name||'').trim() || 'Scheda senza nome';

  if(mode === 'create'){
    const plan = {id: uid(), name: d.name, days: d.days, createdAt: todayISO(), status:'archived', archivedAt:null};
    state.plans.push(plan);
    if(d.makeActive) activatePlan(plan.id, true);
  } else if(mode === 'update'){
    const p = state.plans.find(x=>x.id===d.id);
    if(p){ p.name = d.name; p.days = d.days; }
  } else if(mode === 'newversion'){
    const old = state.plans.find(x=>x.id===d.id);
    const wasActive = old && old.status === 'active';
    if(old){ old.status = 'archived'; old.archivedAt = todayISO(); }
    const plan = {id: uid(), name: d.name, days: d.days, createdAt: todayISO(), status: wasActive ? 'active':'archived', archivedAt:null};
    state.plans.push(plan);
    if(wasActive) state.activePlanId = plan.id;
  }
  closeSheet();
  scheduleSave(true);
  setTab('plans');
  toast('Scheda salvata');
}
function activatePlan(id, archiveOthers){
  if(archiveOthers){
    state.plans.forEach(p=>{ if(p.status==='active' && p.id!==id){ p.status='archived'; p.archivedAt = todayISO(); } });
  }
  const p = state.plans.find(x=>x.id===id);
  if(p) p.status = 'active';
  state.activePlanId = id;
}
function deletePlan(id){
  state.plans = state.plans.filter(p=>p.id!==id);
  if(state.activePlanId === id) state.activePlanId = null;
  scheduleSave(true);
  render();
  toast('Scheda eliminata');
}

/* ============================= CHARTS ============================= */
const METRICS = {
  weight: {label:'Peso', unit:'kg', color:'var(--accent)'},
  height: {label:'Altezza', unit:'cm', color:'#2FA37A'},
  age: {label:'Età', unit:'anni', color:'#8B5CF6'},

};
function metricPoints(metric){
  const ms = sortedMeasurements();
  if(metric === 'bmi'){
    return ms.filter(m=>m.weight!=null && m.height!=null).map(m=>({date:m.date, value:computeBMI(m.weight,m.height)}));
  }
  return ms.filter(m=>m[metric]!=null).map(m=>({date:m.date, value:m[metric]}));
}
function renderCharts(){
  const el = document.querySelector('[data-view="charts"]');
  el.innerHTML = `
    <div class="chip-group" id="metricChips">
      ${Object.keys(METRICS).map(k=>`<button class="chip ${ui.chartMetric===k?'active':''}" data-action="set-metric" data-metric="${k}">${METRICS[k].label}</button>`).join('')}
    </div>
    <div class="chip-group mt-8" id="horizonChips">
      ${[['1m','1M'],['3m','3M'],['6m','6M'],['1y','1A'],['all','Tutto']].map(([k,l])=>`<button class="chip ${ui.chartHorizon===k?'active':''}" data-action="set-horizon" data-horizon="${k}">${l}</button>`).join('')}
    </div>
    <div class="card mt-14" id="chartCard"></div>
  `;
  renderChartCard();
}
function renderChartCard(){
  const card = document.getElementById('chartCard');
  if(!card) return;
  const metric = METRICS[ui.chartMetric];
  let points = metricPoints(ui.chartMetric);
  const days = HORIZON_DAYS[ui.chartHorizon];
  const cutoff = new Date(Date.now() - days*86400000).toISOString().slice(0,10);
  const inRange = points.filter(p => p.date >= cutoff);

  if(inRange.length < 2){
    card.innerHTML = `
      <div class="empty" style="border:none;padding:26px 10px;">
        <div class="icon-wrap">${ICONS.ruler}</div>
        <h3>Dati insufficienti</h3>
        <p>Servono almeno due rilevazioni con ${metric.label.toLowerCase()} nel periodo selezionato.</p>
      </div>`;
    return;
  }
  card.innerHTML = buildLineChartSvg(inRange, metric) + chartSummaryHtml(inRange, metric);
  wireChartInteraction(card, inRange, metric);
}
function chartSummaryHtml(points, metric){
  const vals = points.map(p=>p.value);
  const min = Math.min(...vals), max = Math.max(...vals);
  const first = points[0].value, last = points[points.length-1].value;
  const delta = last - first;
  const sign = delta>0?'+':'';
  return `
    <div class="chart-summary">
      <div>Attuale<b class="num">${last.toFixed(1)}${metric.unit}</b></div>
      <div>Variazione<b class="num">${sign}${delta.toFixed(1)}${metric.unit}</b></div>
      <div>Minimo<b class="num">${min.toFixed(1)}${metric.unit}</b></div>
      <div>Massimo<b class="num">${max.toFixed(1)}${metric.unit}</b></div>
    </div>
  `;
}
function buildLineChartSvg(points, metric){
  const W = 500, H = 220, padL = 38, padR = 14, padT = 18, padB = 26;
  const vals = points.map(p=>p.value);
  let vMin = Math.min(...vals), vMax = Math.max(...vals);
  if(vMin === vMax){ vMin -= 1; vMax += 1; }
  const pad = (vMax-vMin)*0.15;
  vMin -= pad; vMax += pad;
  const t0 = new Date(points[0].date).getTime();
  const t1 = new Date(points[points.length-1].date).getTime();
  const tSpan = Math.max(1, t1-t0);
  const x = (d) => padL + (t1===t0 ? (W-padL-padR)/2 : ((new Date(d).getTime()-t0)/tSpan) * (W-padL-padR));
  const y = (v) => H-padB - ((v-vMin)/(vMax-vMin)) * (H-padT-padB);

  const path = points.map((p,i)=> (i===0?'M':'L') + x(p.date).toFixed(1) + ' ' + y(p.value).toFixed(1)).join(' ');
  const areaPath = path + ` L ${x(points[points.length-1].date).toFixed(1)} ${H-padB} L ${x(points[0].date).toFixed(1)} ${H-padB} Z`;

  const gridLines = [0,1,2,3].map(i=>{
    const v = vMin + (vMax-vMin)*i/3;
    const yy = y(v);
    return `<line x1="${padL}" x2="${W-padR}" y1="${yy.toFixed(1)}" y2="${yy.toFixed(1)}" stroke="var(--border)" stroke-width="1"/>
            <text x="${padL-8}" y="${(yy+3.5).toFixed(1)}" font-size="10" text-anchor="end" fill="var(--ink-3)" font-weight="700">${v.toFixed(0)}</text>`;
  }).join('');

  const last = points[points.length-1];
  const gradId = 'grad-' + ui.chartMetric;

  return `
  <div class="chart-wrap">
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;" id="chartSvg">
      <defs>
        <linearGradient id="${gradId}" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="${metric.color}" stop-opacity="0.22"/>
          <stop offset="100%" stop-color="${metric.color}" stop-opacity="0"/>
        </linearGradient>
      </defs>
      ${gridLines}
      <text x="${padL}" y="${H-6}" font-size="10" fill="var(--ink-3)" font-weight="700">${fmtDateShort(points[0].date)}</text>
      <text x="${W-padR}" y="${H-6}" font-size="10" text-anchor="end" fill="var(--ink-3)" font-weight="700">${fmtDateShort(points[points.length-1].date)}</text>
      <path d="${areaPath}" fill="url(#${gradId})" stroke="none"/>
      <path d="${path}" fill="none" stroke="${metric.color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="${x(last.date).toFixed(1)}" cy="${y(last.value).toFixed(1)}" r="4.5" fill="${metric.color}" stroke="var(--surface)" stroke-width="2"/>
      <g id="hoverGroup" style="opacity:0;">
        <line id="hoverLine" x1="0" y1="${padT}" x2="0" y2="${H-padB}" stroke="var(--ink-3)" stroke-width="1" stroke-dasharray="3,3"/>
        <circle id="hoverDot" r="5" fill="${metric.color}" stroke="var(--surface)" stroke-width="2"/>
      </g>
      <rect id="hoverCapture" x="${padL}" y="0" width="${W-padL-padR}" height="${H}" fill="transparent"/>
    </svg>
    <div class="chart-tooltip" id="chartTooltip"></div>
  </div>`;
}
function wireChartInteraction(card, points, metric){
  const svg = card.querySelector('#chartSvg');
  const capture = card.querySelector('#hoverCapture');
  const hoverGroup = card.querySelector('#hoverGroup');
  const hoverLine = card.querySelector('#hoverLine');
  const hoverDot = card.querySelector('#hoverDot');
  const tooltip = card.querySelector('#chartTooltip');
  if(!svg || !capture) return;
  const W = 500, H = 220, padL = 38, padR = 14, padT = 18, padB = 26;
  const vals = points.map(p=>p.value);
  let vMin = Math.min(...vals), vMax = Math.max(...vals);
  if(vMin === vMax){ vMin -= 1; vMax += 1; }
  const pad = (vMax-vMin)*0.15; vMin -= pad; vMax += pad;
  const t0 = new Date(points[0].date).getTime();
  const t1 = new Date(points[points.length-1].date).getTime();
  const tSpan = Math.max(1, t1-t0);
  const xOf = (d) => padL + (t1===t0 ? (W-padL-padR)/2 : ((new Date(d).getTime()-t0)/tSpan) * (W-padL-padR));
  const yOf = (v) => H-padB - ((v-vMin)/(vMax-vMin)) * (H-padT-padB);

  function moveTo(clientX){
    const rect = svg.getBoundingClientRect();
    const svgX = ((clientX - rect.left) / rect.width) * W;
    let nearest = points[0], nd = Infinity;
    points.forEach(p=>{ const d = Math.abs(xOf(p.date)-svgX); if(d<nd){nd=d; nearest=p;} });
    const px = xOf(nearest.date), py = yOf(nearest.value);
    hoverGroup.style.opacity = '1';
    hoverLine.setAttribute('x1', px); hoverLine.setAttribute('x2', px);
    hoverDot.setAttribute('cx', px); hoverDot.setAttribute('cy', py);
    const pctX = (px/W)*100;
    tooltip.style.left = pctX + '%';
    tooltip.style.top = ((py/H)*100) + '%';
    tooltip.textContent = fmtDateShort(nearest.date) + ' · ' + nearest.value.toFixed(1) + metric.unit;
    tooltip.classList.add('show');
  }
  function clear(){ hoverGroup.style.opacity='0'; tooltip.classList.remove('show'); }
  capture.addEventListener('mousemove', e=> moveTo(e.clientX));
  capture.addEventListener('mouseleave', clear);
  capture.addEventListener('touchstart', e=>{ moveTo(e.touches[0].clientX); }, {passive:true});
  capture.addEventListener('touchmove', e=>{ moveTo(e.touches[0].clientX); e.preventDefault(); }, {passive:false});
  capture.addEventListener('touchend', clear);
}

/* ============================= EVENTS ============================= */
function readImportedFile(file){
  const reader = new FileReader();
  reader.onload = () => {
    const parsed = parseMarkdownPlan(String(reader.result || ''));
    if(!parsed.days.length){ toast('Non ho trovato esercizi nel file'); return; }
    ui.planDraft = {id:null, name: parsed.name, days: parsed.days, makeActive: state.plans.filter(p=>p.status==='active').length===0};
    ui.planDraftMode = 'create';
    renderPlanEditorSheet();
    toast('File importato — controlla e salva');
  };
  reader.readAsText(file);
}

const BUBBLE_SELECTOR = '.btn, .icon-btn, .chip, .list-row, .add-row-btn, .set-dot, .set-dot-timer, .navbtn, .topbar-action';
const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function spawnBubble(el, x, y){
  if(reduceMotion) return;
  const rect = el.getBoundingClientRect();
  const size = Math.max(rect.width, rect.height) * 1.7;
  const bubble = document.createElement('span');
  bubble.className = 'bubble';
  bubble.style.width = bubble.style.height = size + 'px';
  bubble.style.left = (x - rect.left - size/2) + 'px';
  bubble.style.top = (y - rect.top - size/2) + 'px';
  bubble.addEventListener('animationend', () => bubble.remove());
  el.appendChild(bubble);
}

function preventZoomGestures(){
  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('gesturechange', e => e.preventDefault());
  document.addEventListener('gestureend', e => e.preventDefault());
  document.addEventListener('touchmove', e => { if(e.touches.length > 1) e.preventDefault(); }, {passive:false});
  let lastTouchEnd = 0;
  document.addEventListener('touchend', e => {
    const now = Date.now();
    if(now - lastTouchEnd <= 300) e.preventDefault();
    lastTouchEnd = now;
  }, {passive:false});
}

function wireEvents(){
  preventZoomGestures();
  document.querySelectorAll('.navbtn').forEach(b=> b.addEventListener('click', ()=> setTab(b.dataset.tab)));

  document.body.addEventListener('pointerdown', (e) => {
    const el = e.target.closest(BUBBLE_SELECTOR);
    if(!el || el.disabled) return;
    spawnBubble(el, e.clientX, e.clientY);
  });

  document.body.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-action]');
    if(!btn) return;
    const a = btn.dataset.action;

    if(a==='goto-plans') setTab('plans');
    else if(a==='new-plan') openPlanEditor(null);
    else if(a==='edit-plan') openPlanEditor(btn.dataset.id);
    else if(a==='activate-plan'){ closeSheet(); activatePlan(btn.dataset.id, true); scheduleSave(true); render(); toast('Scheda attivata'); }
    else if(a==='view-plan') openPlanDetailSheet(btn.dataset.id);
    else if(a==='delete-plan'){ confirmDialog('Eliminare definitivamente questa scheda? L\'operazione non è reversibile.', 'Elimina scheda', () => deletePlan(btn.dataset.id)); }
    else if(a==='save-plan') savePlanDraft(btn.dataset.mode);
    else if(a==='close-sheet') closeSheet();
    else if(a==='add-day'){ ui.planDraft.days.push({id:uid(), name:'Giorno '+String.fromCharCode(65+ui.planDraft.days.length), exercises:[{id:uid(),name:'',sets:3,reps:'8-10',rest:90}]}); renderPlanEditorSheet(); }
    else if(a==='remove-day'){ ui.planDraft.days.splice(parseInt(btn.dataset.day,10),1); renderPlanEditorSheet(); }
    else if(a==='add-ex'){ ui.planDraft.days[parseInt(btn.dataset.day,10)].exercises.push({id:uid(),name:'',sets:3,reps:'8-10',rest:90}); renderPlanEditorSheet(); }
    else if(a==='remove-ex'){ ui.planDraft.days[parseInt(btn.dataset.day,10)].exercises.splice(parseInt(btn.dataset.ex,10),1); renderPlanEditorSheet(); }
    else if(a==='import-file'){ document.getElementById('importFileInput').click(); }
    else if(a==='import-help') openImportHelpSheet();
    else if(a==='pick-day') openDayPicker();
    else if(a==='start-day') startDaySession(parseInt(btn.dataset.day,10));
    else if(a==='toggle-set'){
      const ei = parseInt(btn.dataset.ex,10), si = parseInt(btn.dataset.set,10);
      const ex = state.activeSession.exercises[ei];
      ex.setsDone[si] = !ex.setsDone[si];
      if(ex.setsDone[si]) startRestTimer(ex.restSec, ei);
      renderActiveSession(document.querySelector('[data-view="workout"]'));
      scheduleSave();
    }
    else if(a==='start-timer-ex'){
      const ei = parseInt(btn.dataset.ex,10);
      startRestTimer(state.activeSession.exercises[ei].restSec, ei);
    }
    else if(a==='prev-ex' || a==='next-ex' || a==='jump-ex'){
      const s = state.activeSession;
      const last = s.exercises.length - 1;
      if(a==='prev-ex') s.currentExIndex = clamp((s.currentExIndex||0)-1, 0, last);
      else if(a==='next-ex') s.currentExIndex = clamp((s.currentExIndex||0)+1, 0, last);
      else s.currentExIndex = clamp(parseInt(btn.dataset.ex,10), 0, last);
      renderActiveSession(document.querySelector('[data-view="workout"]'));
      scheduleSave();
    }
    else if(a==='day-prev-ex' || a==='day-next-ex' || a==='day-jump-ex'){
      const dayId = btn.dataset.day;
      const last = parseInt(btn.dataset.total,10) - 1;
      const cur = ui.dayExIndex[dayId] || 0;
      if(a==='day-prev-ex') ui.dayExIndex[dayId] = clamp(cur-1, 0, last);
      else if(a==='day-next-ex') ui.dayExIndex[dayId] = clamp(cur+1, 0, last);
      else ui.dayExIndex[dayId] = clamp(parseInt(btn.dataset.idx,10), 0, last);
      if(ui.openPlanDetailId) openPlanDetailSheet(ui.openPlanDetailId);
      else render();
    }
    else if(a==='timer-toggle'){
      const s = state.activeSession;
      if(s.restRunning){ s.restRemaining = Math.max(0, Math.round((s.restEndsAt-Date.now())/1000)); s.restRunning=false; }
      else if(s.restRemaining>0){ s.restEndsAt = Date.now()+s.restRemaining*1000; s.restRunning=true; }
      renderTimerPopupIfOpen(); renderMiniTimer(); scheduleSave();
    }
    else if(a==='timer-adjust'){
      const s = state.activeSession; const delta = parseInt(btn.dataset.delta,10);
      if(s.restRunning){ s.restEndsAt += delta*1000; s.restDuration = Math.max(s.restDuration, Math.round((s.restEndsAt-Date.now())/1000)); }
      else { s.restRemaining = Math.max(0, s.restRemaining+delta); s.restDuration = Math.max(s.restDuration, s.restRemaining); }
      renderTimerPopupIfOpen(); scheduleSave();
    }
    else if(a==='timer-skip'){
      const s = state.activeSession; s.restRunning=false; s.restRemaining=0; s.restEndsAt=null; s.restVisible=false;
      closeTimerPopup(); renderMiniTimer(); scheduleSave();
    }
    else if(a==='open-timer-popup') openTimerPopup();
    else if(a==='close-timer-popup') closeTimerPopup();
    else if(a==='cancel-session'){ confirmDialog('Annullare questo allenamento? I progressi non verranno salvati.', 'Annulla allenamento', () => cancelSession()); }
    else if(a==='finish-session') finishSession();
    else if(a==='new-measurement') openMeasurementEditor(null);
    else if(a==='edit-measurement') openMeasurementEditor(btn.dataset.id);
    else if(a==='save-measurement') saveMeasurementDraft();
    else if(a==='delete-measurement'){ confirmDialog('Eliminare questa rilevazione?', 'Elimina rilevazione', () => deleteMeasurement(btn.dataset.id)); }
    else if(a==='set-metric'){ ui.chartMetric = btn.dataset.metric; renderCharts(); }
    else if(a==='set-horizon'){ ui.chartHorizon = btn.dataset.horizon; renderCharts(); }
  });

  document.body.addEventListener('change', (e) => {
    if(e.target.id === 'importFileInput' && e.target.files[0]){ readImportedFile(e.target.files[0]); e.target.value=''; }
  });

  document.body.addEventListener('input', (e) => {
    const t = e.target;
    if(t.dataset.path && ui.planDraft){
      let v = t.value;
      if(t.type==='number') v = v===''? '' : parseFloat(v);
      if(t.type==='checkbox') v = t.checked;
      setDeep(ui.planDraft, t.dataset.path, v);
    }
  });
}

/* ============================= INIT ============================= */
async function init(){
  const remote = await loadRemote();
  const local = loadLocal();
  state = remote || local || defaultState();
  if(!state.activeSession) state.activeSession = null;
  wireEvents();
  setTab('home');
  if(!remote && local) scheduleSave(true);
}
init();

})();
</script>
